<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>ERD FreshMart Payment — Draw.io Style</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #f8f9fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 30px;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    .canvas-wrapper {
      position: relative;
      background: #ffffff;
      border: 1px solid #d1d5db;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      width: 1360px;
      height: 820px;
      overflow: hidden;
    }

    svg.erd-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .entity-text {
      font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: 700;
      fill: #111827;
      letter-spacing: 0.5px;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .relation-text {
      font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: 500;
      fill: #374151;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>
</head>
<body>

  <div class="canvas-wrapper">
    <svg class="erd-canvas" viewBox="0 0 1360 820" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- DRAW.IO GRID PATTERN -->
        <pattern id="smallGrid" width="10" height="10" patternUnits="userSpaceOnUse">
          <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#f1f3f5" stroke-width="0.75"/>
        </pattern>
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
          <rect width="20" height="20" fill="url(#smallGrid)"/>
          <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e5e7eb" stroke-width="1"/>
        </pattern>
      </defs>

      <!-- Grid Background -->
      <rect width="100%" height="100%" fill="url(#grid)" />

      <!-- ==================== CONNECTING LINES (ORTHOGONAL) ==================== -->
      <g stroke="#1f2937" stroke-width="1.2" fill="none">

        <!-- 1. DIA_CHI_GIAO_HANG (410, 110) -> NGUOI_DUNG (410, 230) -->
        <path d="M 410 110 L 410 230" />
        <!-- Ticks at DIA_CHI_GIAO_HANG (Many: >|) -->
        <path d="M 404 122 L 410 114 L 416 122" />
        <line x1="403" y1="126" x2="417" y2="126" />
        <!-- Ticks at NGUOI_DUNG (One: ||) -->
        <line x1="403" y1="216" x2="417" y2="216" />
        <line x1="403" y1="222" x2="417" y2="222" />


        <!-- 2. CUA_HANG (190, 255) -> NGUOI_DUNG (340, 255) -->
        <path d="M 190 255 L 340 255" />
        <!-- Ticks at CUA_HANG (One: ||) -->
        <line x1="198" y1="248" x2="198" y2="262" />
        <line x1="204" y1="248" x2="204" y2="262" />
        <!-- Ticks at NGUOI_DUNG (One: ||) -->
        <line x1="326" y1="248" x2="326" y2="262" />
        <line x1="332" y1="248" x2="332" y2="262" />


        <!-- 3. NGUOI_DUNG (480, 255) -> DON_HANG (630, 255) -->
        <path d="M 480 255 L 630 255" />
        <!-- Ticks at NGUOI_DUNG (One: ||) -->
        <line x1="488" y1="248" x2="488" y2="262" />
        <line x1="494" y1="248" x2="494" y2="262" />
        <!-- Ticks at DON_HANG (Many: >|) -->
        <path d="M 618 249 L 626 255 L 618 261" />
        <line x1="614" y1="248" x2="614" y2="262" />


        <!-- 4. DON_HANG (770, 255) -> CHI_TIET_DON_HANG (930, 255) -->
        <path d="M 770 255 L 930 255" />
        <!-- Ticks at DON_HANG (One: ||) -->
        <line x1="778" y1="248" x2="778" y2="262" />
        <line x1="784" y1="248" x2="784" y2="262" />
        <!-- Ticks at CHI_TIET_DON_HANG (Many: >|) -->
        <path d="M 918 249 L 926 255 L 918 261" />
        <line x1="914" y1="248" x2="914" y2="262" />


        <!-- 5. MA_GIAM_GIA (700, 110) -> DON_HANG (700, 230) -->
        <path d="M 700 110 L 700 230" />
        <!-- Ticks at MA_GIAM_GIA (One: ||) -->
        <line x1="693" y1="118" x2="707" y2="118" />
        <line x1="693" y1="124" x2="707" y2="124" />
        <!-- Ticks at DON_HANG (Many: >|) -->
        <path d="M 694 218 L 700 226 L 706 218" />
        <line x1="693" y1="214" x2="707" y2="214" />


        <!-- 6. CUA_HANG (120, 280) -> CONG_THANH_TOAN (120, 430) -->
        <path d="M 120 280 L 120 430" />
        <!-- Ticks at CUA_HANG (One: ||) -->
        <line x1="113" y1="288" x2="127" y2="288" />
        <line x1="113" y1="294" x2="127" y2="294" />
        <!-- Ticks at CONG_THANH_TOAN (Many: >|) -->
        <path d="M 114 418 L 120 426 L 126 418" />
        <line x1="113" y1="414" x2="127" y2="414" />


        <!-- 7. DON_HANG (700, 280) -> GIAO_DICH (700, 430) -->
        <path d="M 700 280 L 700 430" />
        <!-- Ticks at DON_HANG (One: ||) -->
        <line x1="693" y1="288" x2="707" y2="288" />
        <line x1="693" y1="294" x2="707" y2="294" />
        <!-- Ticks at GIAO_DICH (Many: >|) -->
        <path d="M 694 418 L 700 426 L 706 418" />
        <line x1="693" y1="414" x2="707" y2="414" />


        <!-- 8. CONG_THANH_TOAN (190, 455) -> GIAO_DICH (630, 455) -->
        <path d="M 190 455 L 630 455" />
        <!-- Ticks at CONG_THANH_TOAN (One: ||) -->
        <line x1="198" y1="448" x2="198" y2="462" />
        <line x1="204" y1="448" x2="204" y2="462" />
        <!-- Ticks at GIAO_DICH (Many: >|) -->
        <path d="M 618 449 L 626 455 L 618 461" />
        <line x1="614" y1="448" x2="614" y2="462" />


        <!-- 9. GIAO_DICH (700, 480) -> NHAT_KY_WEBHOOK (700, 630) -->
        <path d="M 700 480 L 700 630" />
        <!-- Ticks at GIAO_DICH (One: ||) -->
        <line x1="693" y1="488" x2="707" y2="488" />
        <line x1="693" y1="494" x2="707" y2="494" />
        <!-- Ticks at NHAT_KY_WEBHOOK (Many: >|) -->
        <path d="M 694 618 L 700 626 L 706 618" />
        <line x1="693" y1="614" x2="707" y2="614" />


        <!-- 10. CHI_TIET_DON_HANG (1005, 280) -> SAN_PHAM (1005, 430) -->
        <path d="M 1005 280 L 1005 430" />
        <!-- Ticks at CHI_TIET_DON_HANG (Many: >|) -->
        <path d="M 999 292 L 1005 284 L 1011 292" />
        <line x1="998" y1="296" x2="1012" y2="296" />
        <!-- Ticks at SAN_PHAM (One: ||) -->
        <line x1="998" y1="416" x2="1012" y2="416" />
        <line x1="998" y1="422" x2="1012" y2="422" />


        <!-- 11. SAN_PHAM (1005, 480) -> DANH_MUC (1005, 630) -->
        <path d="M 1005 480 L 1005 630" />
        <!-- Ticks at SAN_PHAM (Many: >|) -->
        <path d="M 999 492 L 1005 484 L 1011 492" />
        <line x1="998" y1="496" x2="1012" y2="496" />
        <!-- Ticks at DANH_MUC (One: ||) -->
        <line x1="998" y1="616" x2="1012" y2="616" />
        <line x1="998" y1="622" x2="1012" y2="622" />

      </g>

      <!-- ==================== RELATION DIAMONDS ==================== -->
      <!-- D1: DIA_CHI_GIAO_HANG - NGUOI_DUNG -->
      <g transform="translate(388, 148)">
        <polygon points="22,0 44,22 22,44 0,22" fill="#ffffff" stroke="#1f2937" stroke-width="1.2" />
        <text x="22" y="22" class="relation-text">Có</text>
      </g>

      <g transform="translate(243, 233)">
        <polygon points="22,0 44,22 22,44 0,22" fill="#ffffff" stroke="#1f2937" stroke-width="1.2" />
        <text x="22" y="22" class="relation-text">Có</text>
      </g>

      <g transform="translate(533, 233)">

      </g>

      <!-- D4: DON_HANG - CHI_TIET_DON_HANG -->
      <g transform="translate(828, 233)">
        <polygon points="22,0 44,22 22,44 0,22" fill="#ffffff" stroke="#1f2937" stroke-width="1.2" />

      </g>

      <!-- D5: MA_GIAM_GIA - DON_HANG -->
      <g transform="translate(678, 148)">
        <polygon points="22,0 44,22 22,44 0,22" fill="#ffffff" stroke="#1f2937" stroke-width="1.2" />

      </g>

      <!-- D6: CUA_HANG - CONG_THANH_TOAN -->
      <g transform="translate(98, 333)">
        <polygon points="22,0 44,22 22,44 0,22" fill="#ffffff" stroke="#1f2937" stroke-width="1.2" />
        <text x="22" y="22" class="relation-text">Có</text>
      </g>

      <!-- D7: DON_HANG - GIAO_DICH -->
      <g transform="translate(678, 333)">
        <polygon points="22,0 44,22 22,44 0,22" fill="#ffffff" stroke="#1f2937" stroke-width="1.2" />
        <text x="22" y="22" class="relation-text">Có</text>
      </g>

      <!-- D8: CONG_THANH_TOAN - GIAO_DICH -->
      <g transform="translate(388, 433)">
        <polygon points="22,0 44,22 22,44 0,22" fill="#ffffff" stroke="#1f2937" stroke-width="1.2" />
        <text x="22" y="22" class="relation-text">Có</text>
      </g>

      <!-- D9: GIAO_DICH - NHAT_KY_WEBHOOK -->
      <g transform="translate(678, 533)">
        <polygon points="22,0 44,22 22,44 0,22" fill="#ffffff" stroke="#1f2937" stroke-width="1.2" />
        <text x="22" y="22" class="relation-text">Có</text>
      </g>

      <!-- D10: CHI_TIET_DON_HANG - SAN_PHAM -->
      <g transform="translate(983, 333)">
        <polygon points="22,0 44,22 22,44 0,22" fill="#ffffff" stroke="#1f2937" stroke-width="1.2" />
        <text x="22" y="22" class="relation-text">Có</text>
      </g>

      <!-- D11: SAN_PHAM - DANH_MUC -->
      <g transform="translate(983, 533)">
        <polygon points="22,0 44,22 22,44 0,22" fill="#ffffff" stroke="#1f2937" stroke-width="1.2" />
        <text x="22" y="22" class="relation-text">Có</text>
      </g>


      <!-- ==================== ENTITY RECTANGLES (DRAW.IO SHAPE) ==================== -->
      
      <!-- 1. DIA_CHI_GIAO_HANG (Top 1) -->
      <g transform="translate(330, 60)">
        <rect width="160" height="50" fill="#ffffff" stroke="#1f2937" stroke-width="1.2" />
        <line x1="12" y1="0" x2="12" y2="50" stroke="#1f2937" stroke-width="1" />
        <line x1="148" y1="0" x2="148" y2="50" stroke="#1f2937" stroke-width="1" />
        <text x="80" y="25" class="entity-text">DIA_CHI_GIAO_HANG</text>
      </g>

      <!-- 2. MA_GIAM_GIA (Top 2) -->
      <g transform="translate(630, 60)">
        <rect width="140" height="50" fill="#ffffff" stroke="#1f2937" stroke-width="1.2" />
        <line x1="12" y1="0" x2="12" y2="50" stroke="#1f2937" stroke-width="1" />
        <line x1="128" y1="0" x2="128" y2="50" stroke="#1f2937" stroke-width="1" />
        <text x="70" y="25" class="entity-text">MA_GIAM_GIA</text>
      </g>

      <!-- 3. CUA_HANG (Row 2, Col 1) -->
      <g transform="translate(50, 230)">
        <rect width="140" height="50" fill="#ffffff" stroke="#1f2937" stroke-width="1.2" />
        <line x1="12" y1="0" x2="12" y2="50" stroke="#1f2937" stroke-width="1" />
        <line x1="128" y1="0" x2="128" y2="50" stroke="#1f2937" stroke-width="1" />

      </g>

      <!-- 4. NGUOI_DUNG (Row 2, Col 2) -->
      <g transform="translate(340, 230)">
        <rect width="140" height="50" fill="#ffffff" stroke="#1f2937" stroke-width="1.2" />
        <line x1="12" y1="0" x2="12" y2="50" stroke="#1f2937" stroke-width="1" />
        <line x1="128" y1="0" x2="128" y2="50" stroke="#1f2937" stroke-width="1" />
        <text x="70" y="25" class="entity-text">NGUOI_DUNG</text>
      </g>

      <!-- 5. DON_HANG (Row 2, Col 3) -->
      <g transform="translate(630, 230)">
        <rect width="140" height="50" fill="#ffffff" stroke="#1f2937" stroke-width="1.2" />
        <line x1="12" y1="0" x2="12" y2="50" stroke="#1f2937" stroke-width="1" />
        <line x1="128" y1="0" x2="128" y2="50" stroke="#1f2937" stroke-width="1" />

      </g>

      <!-- 6. CHI_TIET_DON_HANG (Row 2, Col 4) -->

        <rect width="160" height="50" fill="#ffffff" stroke="#1f2937" stroke-width="1.2" />
        <line x1="12" y1="0" x2="12" y2="50" stroke="#1f2937" stroke-width="1" />
        <line x1="148" y1="0" x2="148" y2="50" stroke="#1f2937" stroke-width="1" />

      <!-- 7. CONG_THANH_TOAN (Row 3, Col 1) -->
      <g transform="translate(45, 430)">
        <rect width="150" height="50" fill="#ffffff" stroke="#1f2937" stroke-width="1.2" />

        <line x1="138" y1="0" x2="138" y2="50" stroke="#1f2937" stroke-width="1" />

      </g>

      <!-- 8. GIAO_DICH (Row 3, Col 3) -->
      <g transform="translate(630, 430)">
        <rect width="140" height="50" fill="#ffffff" stroke="#1f2937" stroke-width="1.2" />

        <line x1="128" y1="0" x2="128" y2="50" stroke="#1f2937" stroke-width="1" />

      <!-- 9. SAN_PHAM (Row 3, Col 4) -->

        <line x1="148" y1="0" x2="148" y2="50" stroke="#1f2937" stroke-width="1" />

        <rect width="140" height="50" fill="#ffffff" stroke="#1f2937" stroke-width="1.2" />

</body>
</html>
